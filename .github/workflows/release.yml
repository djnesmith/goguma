name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The command line release: four binaries per platform, archives, checksums,
  # and the Homebrew formula.
  cli:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # goreleaser builds the changelog from history

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # A tagged build that fails its own tests is not a release.
      - name: test
        run: go test ./... -count=1

      # The certificate is imported here as well as in the app job below, and
      # deliberately not factored out: the two run on separate runners, so each
      # needs its own keychain and neither can borrow the other's. The steps are
      # identical on purpose, so a change to one is obviously owed to the other.
      - name: check signing credentials
        id: creds
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE_P12 }}
        run: |
          if [ -z "$CERT" ]; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::warning::MACOS_CERTIFICATE_P12 is not set, so the archives"
            echo "::warning::will be ad-hoc signed and 'goguma install' will not"
            echo "::warning::be able to name who signed the helper."
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      - name: import the Developer ID certificate
        if: steps.creds.outputs.have == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          echo "$CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          # Without this, codesign blocks on a UI prompt that nothing can answer
          # and the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f /tmp/cert.p12
          security find-identity -v -p codesigning build.keychain

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A separate PAT with write access to junnam586/homebrew-tap. The
          # default GITHUB_TOKEN cannot push to another repository, so without
          # this the formula step fails after the artifacts are already built.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          # The public half of the advisory signing key, compiled in by
          # .goreleaser.yaml. Unset is a supported state and is what every
          # release so far has shipped: with no key the daemon never makes the
          # request and reports the feature as unavailable, so an absent secret
          # cannot break a build. The private half signs the feed and must
          # never be here.
          GOGUMA_ADVISORY_PUBKEY: ${{ secrets.GOGUMA_ADVISORY_PUBKEY }}
          # Read by macos/scripts/sign-binary.sh, the post-build hook that signs
          # each darwin binary before it is archived. Unset means ad-hoc, which
          # is what every build did before this existed.
          SIGN_ID: ${{ secrets.MACOS_SIGN_IDENTITY }}

      # The archives goreleaser just built are signed but not notarized. The
      # app and disk image get their tickets in the app job below; these bare
      # binaries are what the Homebrew cask downloads, Homebrew quarantines
      # what it downloads, and Gatekeeper rejects a quarantined binary whose
      # cdhash Apple has never seen. In the field that read as `brew install`
      # working and the first `goguma` hanging on a dialog nobody associates
      # with a command line tool.
      #
      # A bare Mach-O cannot be stapled, so there is nothing to write back
      # into the archives: the ticket lives with Apple and Gatekeeper fetches
      # it online at first run. That is also why running after goreleaser has
      # assembled and uploaded the archives is sound; their bytes do not
      # change. One zip holding both darwin directories notarizes all eight
      # cdhashes in a single submission.
      - name: notarize the darwin binaries
        if: steps.creds.outputs.have == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          staging=$(mktemp -d)
          for dir in dist/*_darwin_*/; do
            cp -R "$dir" "$staging/"
          done
          ditto -c -k "$staging" /tmp/goguma-cli.zip
          xcrun notarytool submit /tmp/goguma-cli.zip \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
          # Prove a binary now passes the assessment a user's Mac will run,
          # rather than trusting that the ticket exists.
          spctl --assess --type execute -vv dist/*_darwin_arm64*/goguma

  # The download: a signed, notarized, stapled disk image containing the menu
  # bar app, with the command line tools bundled inside it.
  #
  # Runs after the CLI job so a failure here cannot leave a half-published
  # release with no binaries in it.
  app:
    needs: cli
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: check signing credentials
        id: creds
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE_P12 }}
        run: |
          if [ -z "$CERT" ]; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::warning::MACOS_CERTIFICATE_P12 is not set, so no app will be"
            echo "::warning::published. The CLI release above is unaffected."
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      # A dedicated keychain, not the login one: the runner has no login
      # keychain worth speaking of, and a throwaway keychain means the private
      # key cannot outlive the job.
      - name: import the Developer ID certificate
        if: steps.creds.outputs.have == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          echo "$CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          # Without this, codesign blocks on a UI prompt that nothing can answer
          # and the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f /tmp/cert.p12
          security find-identity -v -p codesigning build.keychain

      - name: build and sign the app
        if: steps.creds.outputs.have == 'true'
        env:
          VERSION: ${{ github.ref_name }}
          SIGN_ID: ${{ secrets.MACOS_SIGN_IDENTITY }}
          # Same key the CLI archives get. The app bundles its own daemon, so
          # leaving it out here would mean whether you receive notices depends
          # on whether you downloaded the app or used Homebrew.
          GOGUMA_ADVISORY_PUBKEY: ${{ secrets.GOGUMA_ADVISORY_PUBKEY }}
        run: cd macos && ./scripts/make-app.sh release

      # Notarized and stapled in two passes, app first and disk image second,
      # because a ticket is bound to the hash of the thing it was issued for.
      #
      # Notarizing only the disk image leaves the app inside it without a ticket
      # of its own. That looks fine in testing, because a machine that can reach
      # Apple verifies the app online. It fails on a machine that cannot: the
      # user drags goguma to Applications, opens it on a plane or behind a
      # captive portal, and macOS reports that the app is damaged, which is a
      # spectacularly misleading way to say "I could not phone home".
      #
      # So the app is notarized and stapled before the disk image is built
      # around it, and the disk image is then notarized and stapled in turn.
      - name: notarize and staple the app
        if: steps.creds.outputs.have == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # ditto, not zip: zip does not preserve the symlinks and extended
          # attributes inside a bundle, and notarization rejects what comes out.
          ditto -c -k --keepParent macos/build/goguma.app /tmp/goguma-app.zip
          xcrun notarytool submit /tmp/goguma-app.zip \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple macos/build/goguma.app
          xcrun stapler validate macos/build/goguma.app
          # Stapling writes into the bundle, so prove the seal still holds.
          codesign --verify --deep --strict macos/build/goguma.app

      - name: package, notarize and staple the disk image
        if: steps.creds.outputs.have == 'true'
        env:
          VERSION: ${{ github.ref_name }}
          SIGN_ID: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd macos && ./scripts/make-dmg.sh && cd ..
          DMG="macos/build/goguma-${VERSION}.dmg"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$DMG"
          # Proves the finished artifact is what a stranger's Mac will accept,
          # rather than trusting that the previous steps meant to.
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature -vv "$DMG"
          cp "$DMG" "goguma_${VERSION}.dmg"

      - name: attach the disk image to the release
        if: steps.creds.outputs.have == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        # Twice, under two names.
        #
        # The versioned one is what lands in somebody's Downloads folder and
        # should say which version it is. The stable one is what a download
        # button can point at: `releases/latest/download/<name>` only resolves
        # for a filename that does not change between releases, and without
        # one "Download for Mac" has to send people to a release page to pick
        # the file out themselves, which is where most of them stop.
        run: |
          gh release upload "$VERSION" "goguma_${VERSION}.dmg" --clobber
          cp "goguma_${VERSION}.dmg" goguma.dmg
          gh release upload "$VERSION" goguma.dmg --clobber
