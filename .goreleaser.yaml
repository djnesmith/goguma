version: 2

project_name: goguma

before:
  hooks:
    - go mod tidy

# The advisory feed's public key, compiled in at release time.
#
# Defaulted to empty on purpose: with no key, internal/advisory.Enabled() is
# false, the daemon never makes the request, and it reports the feature as
# unavailable so the app hides the setting rather than offering a switch that
# does nothing. That is exactly the behaviour of a build without this line, so
# an unset secret changes nothing and cannot break a release.
#
# Set the GOGUMA_ADVISORY_PUBKEY repository secret to the *public* half printed
# by `goguma-advisory keygen` to turn the feature on. The private half signs
# advisories and must never be in CI, in this file, or in the repository.
env:
  - GOGUMA_ADVISORY_PUBKEY={{ if index .Env "GOGUMA_ADVISORY_PUBKEY" }}{{ .Env.GOGUMA_ADVISORY_PUBKEY }}{{ end }}

# cgo is per-platform here, and both settings are load-bearing.
#
# darwin needs CGO_ENABLED=1: internal/power/darwin.go reaches IOKit and
# CoreFoundation to take the idle-sleep assertion and read the SMC, and with cgo
# off that file is dropped and the build fails on "undefined: darwinPlatform".
# That is why releases are cut on a macOS runner, since cgo cross-compiling
# needs the target platform's SDK.
#
# linux needs CGO_ENABLED=0 for the opposite reason: its power layer shells out
# to systemd-inhibit, journalctl and rtcwake rather than linking anything, so it
# is pure Go and cross-compiles cleanly from the same macOS runner. Leaving cgo
# on would ask that runner for a Linux cross-toolchain it does not have.
builds:
  # All four binaries ship together: `goguma install` copies the daemon, the
  # mark wrapper and the helper out of the same directory as the CLI, so an
  # archive missing any of them produces "could not find goguma-helper" at
  # install time.
  - id: goguma
    main: ./cmd/goguma
    binary: goguma
    env: &darwin_env [CGO_ENABLED=1]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags: &ldflags
      - -s -w
      - -X main.version={{ .Version }}
      - -X github.com/junnam586/goguma/internal/advisory.publicKeyB64={{ .Env.GOGUMA_ADVISORY_PUBKEY }}
    overrides: &linux_cgo_off
      - goos: linux
        goarch: amd64
        env: [CGO_ENABLED=0]
      - goos: linux
        goarch: arm64
        env: [CGO_ENABLED=0]

  - id: goguma-daemon
    main: ./cmd/goguma-daemon
    binary: goguma-daemon
    env: *darwin_env
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags: *ldflags
    overrides: *linux_cgo_off

  - id: goguma-helper
    main: ./cmd/goguma-helper
    binary: goguma-helper
    env: *darwin_env
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags: *ldflags
    overrides: *linux_cgo_off

  - id: goguma-mark
    main: ./cmd/goguma-mark
    binary: goguma-mark
    env: *darwin_env
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags: *ldflags
    overrides: *linux_cgo_off

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

# No generated changelog.
#
# Commit subjects are written for whoever next has to change the code, and they
# read as gibberish on a release page: "Give safety its own section" and "Drop
# em dashes" tell a user nothing about what they are downloading. With no
# previous tag to diff against, a generated changelog is also the entire
# history of the project, alphabetised.
#
# release.header below is the release note, written for the person installing
# it. The comparison link returns for the second release, when there is
# something to compare with.
changelog:
  disable: true

# A cask rather than a formula. `brews:` was soft-deprecated in goreleaser 2.10
# and removed in 2.16; Homebrew now prefers casks for pre-compiled binaries,
# which is what these are.
homebrew_casks:
  - name: goguma
    directory: Casks
    repository:
      owner: junnam586
      name: homebrew-tap
    homepage: https://github.com/junnam586/goguma
    description: Wakes your machine for scheduled jobs, then lets it sleep again
    # Skipped unless a token that can push to the tap is present, so a tag cut
    # without one still publishes a working release instead of building every
    # artifact and then failing on the last step.
    skip_upload: '{{ if eq (index .Env "HOMEBREW_TAP_GITHUB_TOKEN") "" }}true{{ else }}false{{ end }}'

    # Tells Homebrew the binaries genuinely come from this repository, which is
    # what lets it skip the "downloaded from the internet" quarantine dance.
    url:
      verified: github.com/junnam586/goguma

    # Deliberately does NOT install the daemon or the root helper. Those go in
    # behind an explicit `goguma install`, which states what needs a password
    # and why. A cask that registered a root service at install time would be
    # doing that silently.
    caveats: |
      goguma is installed but not yet running. To set up the background
      services:

        goguma install

      That installs a user-level daemon and a small privileged helper. The
      helper only blocks sleep and schedules wakes; everything else runs
      unprivileged.

release:
  draft: true
  header: |
    goguma wakes your Mac shortly before each scheduled job, keeps it awake
    while the job runs, and lets it sleep again as soon as the job is done.

    ### Install

    Download the `.dmg`, drag goguma to Applications, and open it. It will
    offer to set itself up, and the command line tools are inside the app.

    Or from the terminal:

    ```sh
    brew install junnam586/tap/goguma
    goguma install
    ```

    ### What it does

    - Finds the scheduled work already on your machine and reports which jobs
      have been missing runs, and how often
    - Wakes for each job, then sleeps again the moment it exits
    - Learns how long each job takes, so the window fits the work
    - Releases a hold early if the machine gets hot or the battery runs low
    - Menu bar app showing what is being held awake and what is coming next

    Requires macOS 26+, or Linux with systemd. Linux ships for amd64 and
    arm64.
  footer: |
    {{ if .PreviousTag }}**Full changelog**: https://github.com/junnam586/goguma/compare/{{ .PreviousTag }}...{{ .Tag }}{{ end }}
