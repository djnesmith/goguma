version: 2

project_name: goguma

before:
  hooks:
    - go mod tidy

# cgo is per-platform here, and both settings are load-bearing.
#
# darwin needs CGO_ENABLED=1: internal/power/darwin.go reaches IOKit and
# CoreFoundation to take the idle-sleep assertion and read the SMC, and with cgo
# off that file is dropped and the build fails on "undefined: darwinPlatform".
# That is why releases are cut on a macOS runner, since cgo cross-compiling
# needs the target platform's SDK.
#
# linux needs CGO_ENABLED=0 for the opposite reason: its power layer shells out
# to systemd-inhibit, journalctl and rtcwake rather than linking anything, so it
# is pure Go and cross-compiles cleanly from the same macOS runner. Leaving cgo
# on would ask that runner for a Linux cross-toolchain it does not have.
builds:
  # All four binaries ship together: `goguma install` copies the daemon, the
  # mark wrapper and the helper out of the same directory as the CLI, so an
  # archive missing any of them produces "could not find goguma-helper" at
  # install time.
  - id: goguma
    main: ./cmd/goguma
    binary: goguma
    env: &darwin_env [CGO_ENABLED=1]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags: &ldflags
      - -s -w
      - -X main.version={{ .Version }}
    overrides: &linux_cgo_off
      - goos: linux
        goarch: amd64
        env: [CGO_ENABLED=0]
      - goos: linux
        goarch: arm64
        env: [CGO_ENABLED=0]

  - id: goguma-daemon
    main: ./cmd/goguma-daemon
    binary: goguma-daemon
    env: *darwin_env
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags: *ldflags
    overrides: *linux_cgo_off

  - id: goguma-helper
    main: ./cmd/goguma-helper
    binary: goguma-helper
    env: *darwin_env
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags: *ldflags
    overrides: *linux_cgo_off

  - id: goguma-mark
    main: ./cmd/goguma-mark
    binary: goguma-mark
    env: *darwin_env
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags: *ldflags
    overrides: *linux_cgo_off

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# A cask rather than a formula. `brews:` was soft-deprecated in goreleaser 2.10
# and removed in 2.16; Homebrew now prefers casks for pre-compiled binaries,
# which is what these are.
homebrew_casks:
  - name: goguma
    directory: Casks
    repository:
      owner: junnam586
      name: homebrew-tap
    homepage: https://github.com/junnam586/goguma
    description: Wakes your machine for scheduled jobs, then lets it sleep again
    # Skipped unless a token that can push to the tap is present, so a tag cut
    # without one still publishes a working release instead of building every
    # artifact and then failing on the last step.
    skip_upload: '{{ if eq (index .Env "HOMEBREW_TAP_GITHUB_TOKEN") "" }}true{{ else }}false{{ end }}'

    # Tells Homebrew the binaries genuinely come from this repository, which is
    # what lets it skip the "downloaded from the internet" quarantine dance.
    url:
      verified: github.com/junnam586/goguma

    # Deliberately does NOT install the daemon or the root helper. Those go in
    # behind an explicit `goguma install`, which states what needs a password
    # and why. A cask that registered a root service at install time would be
    # doing that silently.
    caveats: |
      goguma is installed but not yet running. To set up the background
      services:

        goguma install

      That installs a user-level daemon and a small privileged helper. The
      helper only blocks sleep and schedules wakes; everything else runs
      unprivileged. Run `goguma install --dry-run` first to see exactly what it
      will do.

release:
  draft: true
  footer: |
    **Full changelog**: https://github.com/junnam586/goguma/compare/{{ .PreviousTag }}...{{ .Tag }}
